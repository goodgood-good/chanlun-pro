[project]
name = "chanlun-pro"
version = "1.0.0"
description = "chanlun pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.16.98",
    "apscheduler>=3.11.0",
    "cachetools>=7.1.1",
    "ccxt>=4.4.88",
    "chardet>=5.2.0",
    "dtaidistance>=2.3.13",
    "flask>=3.1.1",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "longbridge>=4.1.0",
    "mytt>=2.9.3",
    "numpy==1.26.4",
    "pandas==2.1.0",
    "pinyin>=0.4.0",
    "prettytable>=3.16.0",
    "pyarrow>=22.0.0",
    "pymysql>=1.1.1",
    "pytdx",
    "pytest>=8.4.1",
    "redis>=6.2.0",
    "requests>=2.32.3",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "sqlalchemy>=2.0.41",
    "ta-lib",
    "tenacity>=9.1.2",
    "tornado>=6.5.1",
    "tqdm>=4.67.1",
]

# 可选依赖：按需求场景分组安装（默认不装）
#   poetry install --extras us / hk / cn-extra / futures / ai / notify / backtest / monitor
#   poetry install --all-extras       # 一次装齐
[project.optional-dependencies]
us = [
    "alpaca-py>=0.40.1",
    "polygon-api-client>=1.14.6",
    "ib-insync>=0.9.86",
]
hk = ["futu-api>=9.2.5208"]
cn-extra = ["baostock>=0.8.9"]
futures = [
    "tqsdk>=3.8.2",
    "openctp-ctp>=6.7.11.0",
]
ai = ["openai>=1.84.0"]
notify = ["lark-oapi>=1.4.17"]
# F2 (2026-05-15): pyecharts 与 matplotlib 移到 [charts] extras
# matplotlib 在 src/ 中没有任何 import (顶层依赖纯死代码), pyecharts 只在
# kcharts.py 和 backtesting/backtest.py 用 (图表渲染 / 回测可视化)。
# web 服务运行不需要这两个包, 顶层依赖让 docker 部署多装 ~100MB 无意义。
charts = [
    "pyecharts==2.1.0",
    "matplotlib>=3.10.3",
]
backtest = [
    "pyfolio-reloaded>=0.9.9",
    "pyecharts==2.1.0",
    "matplotlib>=3.10.3",
]
monitor = ["playwright>=1.53.0"]
all = [
    "alpaca-py>=0.40.1",
    "polygon-api-client>=1.14.6",
    "ib-insync>=0.9.86",
    "futu-api>=9.2.5208",
    "baostock>=0.8.9",
    "tqsdk>=3.8.2",
    "openctp-ctp>=6.7.11.0",
    "openai>=1.84.0",
    "lark-oapi>=1.4.17",
    "pyfolio-reloaded>=0.9.9",
    "pyecharts==2.1.0",
    "matplotlib>=3.10.3",
    "playwright>=1.53.0",
]

[tool.ruff]
# xtquant 是 vendored 的第三方 SDK（迅投 QMT），不纳入 lint
extend-exclude = [
    "src/xtquant",
    # 第三方交易框架/券商 SDK 适配入口，依赖按场景安装，不纳入默认 lint
    "src/cl_myquant",
    "src/cl_vnpy",
    "src/cl_wtpy",
]

[tool.ruff.lint]
# F403/F405: import * 是项目设计（exchange/strategy 子类 import 基类模块）
# E402: 多为 sys.path 设置后 import / 条件 import，属正当模式
# E731/E741: 既有核心算法/单测大量使用短 lambda 与几何变量名，暂作为遗留风格保留
ignore = ["F403", "F405", "E402", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# 这些模块保留兼容性 re-export / 延迟导入入口，不能被 F401 自动删除。
"src/chanlun/exchange/__init__.py" = ["F401"]
"src/chanlun/persistence/file_db.py" = ["F401"]
"src/chanlun/core/cl_interface.py" = ["F401", "F403"]
"src/chanlun/cl_utils/__init__.py" = ["F401", "F403"]
"src/chanlun/core/types/__init__.py" = ["F401", "F403"]
"web/chanlun_chart/cl_app/__init__.py" = ["F401"]
"web/chanlun_chart/cl_app/blueprints/tv.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.poetry]
# package-mode=false: 本项目不发布到 PyPI，Poetry 仅管理依赖，不需要打包配置
package-mode = false

# 本地 wheel 覆盖（与 [project.dependencies] 中无版本的 pytdx / ta-lib 对应）
# Python 版本约束 >=3.10,<3.14：当前 chanlun-pro env 是 3.10；上界因 alpaca-py
# 等包对 3.14+ 的依赖图变化，Poetry resolver 在更宽范围下找不到统一版本。
[tool.poetry.dependencies]
python = ">=3.10,<3.14"
# ta-lib 本地 wheel 按 Python 版本区分；package/ 下有 cp310/cp311/cp312/cp313 多个
# 此处用 marker 区分，避免锁到单一 Python 版本
ta-lib = [
    { path = "package/TA_Lib-0.4.28-cp310-cp310-win_amd64.whl", markers = "python_version == '3.10'" },
    { path = "package/ta_lib-0.4.25-cp311-cp311-win_amd64.whl", markers = "python_version == '3.11'" },
    { path = "package/TA_Lib-0.4.32-cp312-cp312-win_amd64.whl", markers = "python_version == '3.12'" },
    { path = "package/TA_Lib-0.4.32-cp313-cp313-win_amd64.whl", markers = "python_version == '3.13'" },
]
pytdx = { path = "package/pytdx-1.72r2-py3-none-any.whl" }

# 阿里云 PyPI 镜像源（国内网速友好）
[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
