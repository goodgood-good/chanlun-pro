<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>系统设置 · Chanlun Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layui.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-system.css') }}?asset={{ static_asset_token|default('') }}" />
    <script src="{{ url_for('static', filename='layui.js') }}"></script>
    <script src="{{ url_for('static', filename='jquery-3.7.0.min.js') }}"></script>
    {% include 'dark.html' %}
  </head>

  <body class="cp-ui">
    <a class="cp-skip-link" href="#main-content">跳到系统设置</a>
    <main id="main-content" class="cp-page cp-page--compact cp-page-stack">
      <header class="cp-page-header">
        <div class="cp-page-header-copy">
          <span class="cp-eyebrow">SYSTEM INTEGRATION</span>
          <h1>系统设置</h1>
          <p>配置行情数据请求的网络代理。</p>
        </div>
        <div class="cp-page-header-actions">
          <div class="cp-context-card">
            <span>配置范围</span>
            <strong>当前服务</strong>
          </div>
        </div>
      </header>

      <form class="layui-form setting_form cp-section-grid" lay-filter="setting_form" role="form">
        <section class="cp-section-card" aria-labelledby="proxy-title">
          <div class="cp-section-heading">
            <div class="cp-heading-with-index">
              <span class="cp-section-index">01</span>
              <div>
                <h2 id="proxy-title">网络代理</h2>
                <p>仅在数据源需要代理访问时填写，留空表示直连。</p>
              </div>
            </div>
          </div>
          <div class="cp-form-grid cp-form-grid--single">
            <div class="layui-form-item">
              <label class="layui-form-label" for="proxy_host">代理 Host</label>
              <div class="layui-input-block">
                <input id="proxy_host" type="text" name="proxy_host" value="{{ proxy_host }}"
                  placeholder="例如 127.0.0.1" autocomplete="off" class="layui-input" />
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label" for="proxy_port">代理 Port</label>
              <div class="layui-input-block">
                <input id="proxy_port" type="text" name="proxy_port" value="{{ proxy_port }}"
                  inputmode="numeric" placeholder="例如 7890" autocomplete="off" class="layui-input" />
              </div>
            </div>
            <div class="cp-note">
              <span aria-hidden="true">i</span>
              <div><strong>使用提示</strong><br />查看数字货币行情时通常无需单独配置代理。</div>
            </div>
          </div>
        </section>

        <div class="cp-actions cp-actions--sticky cp-section-card--span-2">
          <button class="layui-btn cp-button" lay-submit lay-filter="setting_save" type="submit">
            保存系统配置
          </button>
          <span class="cp-help-text">保存后对后续数据请求生效。</span>
        </div>
      </form>

    </main>

    <script nonce="{{ csp_nonce }}">
      $(function () {
        layui.use(function () {
          const form = layui.form;
          const layer = layui.layer;
          form.on('submit(setting_save)', function (data) {
            var $submit = $(data.elem);
            $submit.prop('disabled', true).addClass('layui-btn-disabled').text('保存中…');
            AppRequest.ajax({
              type: 'POST',
              url: '/setting/save',
              data: data.field,
              dataType: 'json',
              traditional: true,
              timeout: 15000,
              success: function (result) {
                if (result && result.ok === true) layer.msg('配置保存成功');
                else layer.msg((result && result.msg) || '配置保存失败');
              },
              error: function () { layer.msg('配置保存失败，请稍后重试'); },
              complete: function () {
                $submit.prop('disabled', false).removeClass('layui-btn-disabled').text('保存系统配置');
              }
            });
            return false;
          });
        });
      });
    </script>
  </body>
</html>
