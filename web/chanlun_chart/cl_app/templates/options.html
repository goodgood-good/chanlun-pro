<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>图表显示配置 · Chanlun Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layui.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-system.css') }}?asset={{ static_asset_token|default('') }}" />
  <script src="{{ url_for('static', filename='layui.js') }}"></script>
  <script src="{{ url_for('static', filename='jquery-3.7.0.min.js') }}"></script>
  {% include 'dark.html' %}
  {% include 'workspace_head.html' %}
</head>
<body class="cp-ui">
  {% include 'workspace_nav.html' %}
  <a class="cp-skip-link" href="#main-content">跳到显示配置</a>
  <main id="main-content" class="cp-page cp-page--compact cp-page-stack">
    <header class="cp-page-header">
      <div class="cp-page-header-copy">
        <span class="cp-eyebrow">CHART SETTINGS</span>
        <h1>图表显示配置</h1>
        <p>笔、线段与本周期中枢使用固定计算规则，这里控制基础图元是否显示。</p>
      </div>
      <div class="cp-page-header-actions">
        <div class="cp-context-card"><span>当前标的</span><strong>{{ code }}</strong></div>
      </div>
    </header>

    <form class="layui-form layui-form-pane cl_config_setting cp-section-card cp-config-form" lay-filter="cl_config" aria-labelledby="base-display-title">
      <input type="hidden" name="market" value="{{ market }}" />
      <input type="hidden" name="code" value="{{ code }}" />
      <input type="hidden" name="is_del" value="false" />

      <h2 id="base-display-title" class="cp-config-section-title">基础结构图元</h2>

      <div class="layui-form-item" title="配置保存范围">
        <label class="layui-form-label" for="config_use_type">配置范围</label>
        <div class="layui-input-block">
          <select id="config_use_type" name="config_use_type" aria-label="配置范围">
            <option value="common" {% if config_use_type == 'common' %}selected{% endif %}>市场通用</option>
            <option value="custom" {% if config_use_type == 'custom' %}selected{% endif %}>当前标的</option>
          </select>
        </div>
      </div>

      <div class="layui-form-item cp-config-wide cp-base-display-options" role="group" aria-labelledby="base-options-label">
        <span id="base-options-label" class="layui-form-label">显示内容</span>
        <div class="layui-row">
          <div class="layui-col-xs4">
            <input type="checkbox" name="chart_show_fx" value="1" title="分型" aria-label="分型" {% if chart_show_fx == '1' %}checked{% endif %} />
          </div>
          <div class="layui-col-xs4">
            <input type="checkbox" name="chart_show_bi" value="1" title="笔" aria-label="笔" {% if chart_show_bi == '1' %}checked{% endif %} />
          </div>
          <div class="layui-col-xs4">
            <input type="checkbox" name="chart_show_xd" value="1" title="线段" aria-label="线段" {% if chart_show_xd == '1' %}checked{% endif %} />
          </div>
        </div>
      </div>

      <div class="layui-form-item cp-actions cp-actions--sticky">
        <button type="button" class="layui-btn" id="save_cl_config_btn">保存显示配置</button>
        <button type="button" class="layui-btn layui-btn-primary" id="delete_cl_config_btn">删除当前标的配置</button>
      </div>
      <p id="config-save-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script nonce="{{ csp_nonce }}">
    layui.use(['form', 'layer'], function () {
      var form = layui.form;
      var layer = layui.layer;
      var saving = false;
      var requestSerial = 0;
      var editRevision = 0;

      function displayValues() {
        var values = form.val('cl_config') || {};
        return {
          config_use_type: values.config_use_type || 'common',
          chart_show_fx: values.chart_show_fx || '0',
          chart_show_bi: values.chart_show_bi || '0',
          chart_show_xd: values.chart_show_xd || '0'
        };
      }
      function setBusy(value) {
        saving = value;
        $('#save_cl_config_btn, #delete_cl_config_btn').prop('disabled', value);
        $('.cl_config_setting').attr('aria-busy', String(value));
      }
      function notice(message) { $('#config-save-status').text(message); }
      function edited() {
        editRevision += 1;
        notice(saving ? '正在保存提交的版本；新修改尚未保存。' : '显示配置有未保存的修改。');
      }
      function postConfig(isDelete) {
        if (saving) return;
        var submitted = displayValues();
        var revision = editRevision;
        var serial = ++requestSerial;
        var data = Object.assign({market: '{{ market }}', code: '{{ code }}',
          is_del: isDelete ? 'true' : 'false'}, submitted);
        function stillCurrent() {
          return serial === requestSerial && revision === editRevision
            && JSON.stringify(displayValues()) === JSON.stringify(submitted);
        }
        setBusy(true);
        notice(isDelete ? '正在删除当前标的配置…' : '正在保存显示配置…');
        try { AppRequest.ajax({
          type: 'POST',
          url: '/set_cl_config',
          data: data,
          dataType: 'json',
          timeout: 15000,
          success: function (result) {
            if (result && result.ok === true) {
              var message = isDelete ? '当前标的配置已删除' : '显示配置已保存';
              notice(stillCurrent() ? message : message + '；后续修改尚未保存。');
              layer.msg(message, {time: 1200}, function () {
                if (stillCurrent()) location.reload();
                else if (serial === requestSerial) notice(message + '；后续修改尚未保存。');
              });
            } else {
              notice(result && result.msg || '显示配置更新失败，当前修改已保留。');
            }
          },
          error: function (_xhr, status) {
            notice(status === 'timeout' ? '请求超时，保存结果未确认；当前修改已保留，可重新保存。'
              : '显示配置更新失败，当前修改已保留。');
          },
          complete: function () { setBusy(false); }
        }); } catch (_) {
          setBusy(false);
          notice('显示配置更新失败，当前修改已保留。');
        }
      }

      $('.cl_config_setting').on('input change', edited);
      form.on('checkbox', edited);
      form.on('select', edited);
      $('#save_cl_config_btn').on('click', function () { postConfig(false); });
      $('#delete_cl_config_btn').on('click', function () { postConfig(true); });
      form.render();
    });
  </script>
</body>
</html>
