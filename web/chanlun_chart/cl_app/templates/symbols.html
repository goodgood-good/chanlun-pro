<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>标的中心 · Chanlun Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layui.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-system.css') }}?asset={{ static_asset_token|default('') }}" />
    <script src="{{ url_for('static', filename='layui.js') }}"></script>
    <script src="{{ url_for('static', filename='jquery-3.7.0.min.js') }}"></script>
    {% include 'dark.html' %}
    {% include 'workspace_head.html' %}
  </head>

  <body class="cp-ui">
    {% include 'workspace_nav.html' %}
    <a class="cp-skip-link" href="#main-content">跳到标的列表</a>
    <main id="main-content" class="cp-page cp-page-stack">
      <header class="cp-page-header">
        <div class="cp-page-header-copy">
          <span class="cp-eyebrow">MARKET UNIVERSE</span>
          <h1>标的中心</h1>
          <p>按市场、代码、名称或拼音首字母定位标的；点击代码可在新窗口打开结构解盘。</p>
        </div>
        <div class="cp-page-header-actions">
          <div class="cp-context-card">
            <span>当前市场标的</span>
            <strong id="header_total_tip">加载中</strong>
          </div>
        </div>
      </header>

      <section class="cp-section-card" aria-labelledby="filter-title">
        <div class="cp-section-heading">
          <div class="cp-heading-with-index">
            <span class="cp-section-index">01</span>
            <div>
              <h2 id="filter-title">筛选标的</h2>
              <p>切换市场会清空关键词并重新载入对应标的池。</p>
            </div>
          </div>
        </div>
        <form class="layui-form cp-filter-bar" lay-filter="symbols_form" role="search">
          <div class="cp-field">
            <label class="cp-field-label" for="market_select">市场</label>
            <select name="market" lay-filter="market_select" id="market_select" aria-label="选择市场">
              {% for m_key, m_label in markets %}
              <option value="{{ m_key }}" {% if m_key==default_market %}selected{% endif %}>{{ m_label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="cp-field">
            <label class="cp-field-label" for="search_input">代码、名称或拼音</label>
            <input type="search" id="search_input" placeholder="例如 SH.600519、贵州茅台、gzmt"
              autocomplete="off" class="layui-input" />
          </div>
          <div class="cp-filter-actions">
            <button type="button" id="btn_search" class="layui-btn cp-button">
              <i class="layui-icon layui-icon-search" aria-hidden="true"></i>查询
            </button>
            <button type="button" id="btn_reset" class="layui-btn cp-button cp-button--secondary">
              <i class="layui-icon layui-icon-refresh" aria-hidden="true"></i>重置
            </button>
          </div>
        </form>
      </section>

      <section class="cp-data-shell" aria-labelledby="symbols-list-title">
        <header class="cp-data-shell-header">
          <div>
            <h2 id="symbols-list-title">标的列表</h2>
            <p>代码链接会保留当前市场，并在独立标签页打开行情工作台。</p>
          </div>
          <span id="total_tip" class="cp-status-pill" aria-live="polite">正在加载…</span>
        </header>
        <p id="symbols_load_status" class="cp-help-text" role="status" aria-live="polite"></p>
        <div id="symbols_retry_wrap" hidden><button id="symbols_retry" type="button" class="layui-btn cp-button cp-button--secondary">重试目录加载</button></div>
        <div id="symbols_table_wrap" class="cp-data-shell-body">
          <table class="layui-hide" id="symbols_table" lay-filter="symbols_table"></table>
        </div>
      </section>
    </main>

    <script nonce="{{ csp_nonce }}">
      $(function () {
        layui.use(['form', 'table', 'layer'], function () {
          const form = layui.form;
          const table = layui.table;
          const state = { market: $('#market_select').val(), q: '' };
          let renderGeneration = 0, requestGeneration = 0, activeRequest = null;
          let tableInitialized = false;

          function updateCount(total) {
            var copy = '共 ' + total + ' 条';
            $('#total_tip').text(copy);
            $('#header_total_tip').text(total + ' 条');
          }

          function labelPaginationControls() {
            var skipInput = document.querySelector('#symbols_table_wrap .layui-laypage-skip input');
            if (skipInput) {
              skipInput.setAttribute('aria-label', '跳转页码');
              skipInput.setAttribute('inputmode', 'numeric');
            }
            var limitSelect = document.querySelector('#symbols_table_wrap .layui-laypage-limits select');
            if (limitSelect) limitSelect.setAttribute('aria-label', '每页显示数量');
          }

          function usesCompactColumns() {
            return typeof window.matchMedia === 'function'
              && window.matchMedia('(max-width: 720px)').matches;
          }

          function renderTable() {
            const generation = ++renderGeneration;
            const requestMarket = state.market;
            ++requestGeneration;
            if (activeRequest && typeof activeRequest.abort === 'function') activeRequest.abort();
            activeRequest = null;
            $('#total_tip').text('正在加载…');
            $('#header_total_tip').text('加载中');
            $('#symbols_load_status').text('');
            $('#symbols_retry_wrap').prop('hidden', true);
            var compactColumns = usesCompactColumns();
            var columns = [
              {
                field: 'code', title: '代码', width: compactColumns ? 132 : 220, templet: function (d) {
                  const url = '/?market=' + encodeURIComponent(requestMarket)
                    + '&code=' + encodeURIComponent(d.code);
                  const link = document.createElement('a');
                  link.className = 'symbol-code-link';
                  link.href = url;
                  link.target = '_blank';
                  link.rel = 'noopener';
                  link.textContent = String(d.code == null ? '' : d.code);
                  link.setAttribute('aria-label', '在新标签打开 ' + link.textContent + ' 行情工作台');
                  return link.outerHTML;
                }
              },
              { field: 'name', title: '名称', minWidth: compactColumns ? 128 : 200 }
            ];
            if (!compactColumns) {
              columns.push(
                { field: 'pinyin', title: '拼音首字母', width: 180 },
                { field: 'type', title: '类型', width: 120 }
              );
            }
            const options = {
              id: 'symbols_table',
              elem: '#symbols_table',
              url: '/symbols/list',
              method: 'get',
              where: { market: state.market, q: state.q },
              ajax: function (options) {
                const requestId = ++requestGeneration;
                if (activeRequest && typeof activeRequest.abort === 'function') activeRequest.abort();
                const current = () => generation === renderGeneration && requestId === requestGeneration;
                const unavailable = function (message, failed) {
                  if (current()) options.success({ok:true,total:0,items:[],unavailable:{message,failed}});
                };
                activeRequest = AppRequest.ajax(Object.assign({}, options, {
                  timeout: 10000, cache: false,
                  success: function (response) {
                    if (!current()) return;
                    if (!response || response.ok !== true) {
                      unavailable(response?.msg || '市场目录尚未就绪，请稍后重试', response?.status === 'error');
                    } else if (response.market !== requestMarket || !Array.isArray(response.items)) {
                      unavailable('目录响应与当前市场不一致，请重试', true);
                    } else options.success(response);
                  },
                  error: function (xhr, status) {
                    if (status !== 'abort') unavailable(xhr?.responseJSON?.msg || '目录读取失败，请检查连接后重试', true);
                  },
                  complete: function () { if (current()) activeRequest = null; }
                }));
                return activeRequest;
              },
              request: { pageName: 'page', limitName: 'page_size' },
              response: {
                statusName: 'ok',
                statusCode: true,
                countName: 'total',
                dataName: 'items'
              },
              page: {
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                limits: [50, 100, 200, 500],
                limit: 50
              },
              done: function (res) {
                if (generation !== renderGeneration) return;
                if (res?.unavailable) {
                  $('#total_tip').text(res.unavailable.failed ? '读取失败' : '目录未就绪');
                  $('#header_total_tip').text('—');
                  $('#symbols_load_status').text(res.unavailable.message);
                  $('#symbols_retry_wrap').prop('hidden', false);
                } else {
                  updateCount((res && res.total) || 0);
                  $('#symbols_load_status').text(res?.total === 0 ? '目录已就绪，当前条件没有匹配标的。' : '');
                  $('#symbols_retry_wrap').prop('hidden', true);
                }
                labelPaginationControls();
              },
              cols: [columns]
            };
            // Keep the same Layui instance: disposing it leaves its internal
            // delayed layout callbacks pointing at cleared DOM references.
            if (tableInitialized) table.reload('symbols_table', options);
            else { table.render(options); tableInitialized = true; }
          }

          form.on('select(market_select)', function (data) {
            state.market = data.value;
            state.q = '';
            $('#search_input').val('');
            renderTable();
          });

          $('#btn_search').click(function () {
            state.q = ($('#search_input').val() || '').trim();
            renderTable();
          });

          $('#search_input').keydown(function (event) {
            if (event.key === 'Enter') {
              event.preventDefault();
              $('#btn_search').trigger('click');
            }
          });

          $('#btn_reset').click(function () {
            state.q = '';
            $('#search_input').val('').trigger('focus');
            renderTable();
          });
          $('#symbols_retry').click(renderTable);

          var compactMedia = typeof window.matchMedia === 'function'
            ? window.matchMedia('(max-width: 720px)')
            : null;
          var lastCompactState = compactMedia ? compactMedia.matches : false;
          function handleColumnBreakpoint(event) {
            if (event.matches === lastCompactState) return;
            lastCompactState = event.matches;
            renderTable();
          }
          if (compactMedia && typeof compactMedia.addEventListener === 'function') {
            compactMedia.addEventListener('change', handleColumnBreakpoint);
          } else if (compactMedia && typeof compactMedia.addListener === 'function') {
            compactMedia.addListener(handleColumnBreakpoint);
          }

          renderTable();
        });
      });
    </script>
  </body>
</html>
