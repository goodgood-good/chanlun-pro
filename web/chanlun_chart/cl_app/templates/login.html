<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>登录 · Chanlun Pro</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}?asset={{ static_asset_token|default('') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layui.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-system.css') }}?asset={{ static_asset_token|default('') }}" />
  </head>

  <body class="cp-ui">
    <a class="cp-skip-link" href="#main-content">跳到登录区域</a>
    <main id="main-content" class="cp-login-page">
      <section class="cp-login-visual" aria-labelledby="product-title">
        <div class="cp-login-brand">
          <img
            class="cp-product-mark"
            src="{{ url_for('static', filename='chanlun-mark.png') }}?asset={{ static_asset_token|default('') }}"
            alt=""
            aria-hidden="true" />
          <span>CHANLUN PRO</span>
        </div>

        <div class="cp-login-story">
          <span class="cp-eyebrow">STRUCTURE RESEARCH WORKSPACE</span>
          <h1 id="product-title">行情结构研究工作台</h1>
          <p>查看实时行情、自选分组、笔、线段和本周期中枢。</p>
          <div class="cp-login-points" aria-label="工作台能力">
            <span>实时盯盘</span>
            <span>笔与线段中枢</span>
            <span>跨市场自选</span>
            <span>图表与画线</span>
          </div>
        </div>

        <p class="cp-login-footnote">研究工具 · 不替代独立判断 · 不承诺未来收益</p>
      </section>

      <section class="cp-login-panel" aria-labelledby="login-title">
        <div class="cp-login-card">
          <span class="cp-eyebrow">SECURE WORKSPACE</span>
          <h2 id="login-title">进入工作台</h2>
          <p>使用你的账号进入工作台；图表布局与显示偏好会跟随账号保存。</p>

          <form class="layui-form" action="/login" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="layui-form-item">
              <label class="cp-field-label" for="LAY-user-login-username">账号</label>
              <input
                type="text"
                name="username"
                id="LAY-user-login-username"
                value="{{ login_username|default('') }}"
                autocomplete="username"
                maxlength="64"
                required
                autofocus
                placeholder="请输入账号"
                class="layui-input" />
            </div>
            <div class="layui-form-item">
              <label class="cp-field-label" for="LAY-user-login-password">访问密码</label>
              <input
                type="password"
                name="password"
                id="LAY-user-login-password"
                autocomplete="current-password"
                required
                placeholder="请输入访问密码"
                class="layui-input" />
            </div>
            <button class="cp-button layui-btn-fluid" type="submit">进入 Chanlun Pro</button>
            {% if emsg %}<p class="cp-login-error" role="alert">{{ emsg }}</p>{% endif %}
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
