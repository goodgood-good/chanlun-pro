<meta name="csrf-token" content="{{ csrf_token() }}">
<script src="{{ url_for('static', filename='js/app_request.js') }}?asset={{ static_asset_token|default('') }}"></script>
<script type="text/javascript" nonce="{{ csp_nonce }}">
    window.__CHANLUN_ACCOUNT_PREFERENCES__ = {{ account_preferences_bootstrap|default(none)|tojson }};
</script>
<script src="{{ url_for('static', filename='js/workspace_device.js') }}?asset={{ static_asset_token|default('') }}"></script>
<script
    type="text/javascript"
    src="{{ url_for('static', filename='js/account_preferences.js') }}?asset={{ static_asset_token|default('') }}"></script>
<script type="text/javascript" nonce="{{ csp_nonce }}">
    (function () {
        if (window.JSON && window.JSON.parse) {
            var c = document.getElementsByTagName("head");

            try {
                var b = JSON.parse((window.AccountPreferences ? AccountPreferences.getItem('tv_chart') : localStorage.tv_chart) || '{}') || {};
            } catch (d) {
                b = {};
            }
            if ("dark" === b.theme) {
                document.documentElement.classList.add("cl-theme-dark");
                var a = document.createElement("link");
                a.href = "{{ url_for('static', filename='css/layui-theme-dark.css') }}";
                a.rel = "stylesheet";
                a.id = "layuicss-theme-dark";
                c[0].appendChild(a)

                var b = document.createElement("link");
                b.href = "{{ url_for('static', filename='css/xm-select-dark.css') }}";
                b.rel = "stylesheet";
                b.id = "xmselectcss-theme-dark";
                c[0].appendChild(b)
            }
        }
    })();

    // 已移除百度统计脚本（hm.baidu.com）以减少第三方数据外发；如需开启可恢复。
</script>
<script src="{{ url_for('static', filename='js/layui_accessibility.js') }}?asset={{ static_asset_token|default('') }}"></script>
<style>
    .layui-card-body p,
    .layui-card-body li {
        color: #999;
    }
</style>
