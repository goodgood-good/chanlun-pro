name: CI

on:
  push:
    branches: [master, pre]
  pull_request:
    branches: [master, pre]

# 同 ref 的 workflow 连续触发时取消旧的 run，避免连续 push 浪费 minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks 全历史扫描需要完整 git
      - name: Run gitleaks
        # 直接跑 gitleaks 二进制，不用 gitleaks-action：其 JS 包装仍依赖 Node20
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner

  dependency-audit:
    name: Dependency Audit (pip-audit on poetry lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install audit tools
        # poetry-plugin-export: Poetry 2.x 把 export 命令拆出 core，必须装插件才能用
        run: |
          pip install poetry pip-audit
          poetry self add poetry-plugin-export
      - name: Export poetry.lock to requirements
        # 从 poetry.lock 导出 pip 兼容格式（不带 hash 让 pip-audit 不要求严格匹配）
        run: |
          poetry export -f requirements.txt --without-hashes --all-extras -o /tmp/req-all.txt
          # Local Windows wheels are repository artifacts, not registry packages and
          # cannot be resolved by pip-audit on Linux. Audit every registry dependency.
          grep -v -E '(@ file:|package/.*\.whl)' /tmp/req-all.txt > /tmp/req.txt
      - name: Audit dependencies (CVE scan)
        # 审计 Web/AI/通知/回测/监控部署画像；发现漏洞时阻断，不再假通过。
        run: pip-audit -r /tmp/req.txt --no-deps

  test:
    name: Test (pytest)
    # ta-lib 依赖 package/ 下的 win_amd64 wheel，须用 Windows runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'  # 对应 package/TA_Lib-0.4.28-cp310 wheel
      - name: Prepare config from template
        # config.py 在 .gitignore 中（含用户私密配置），CI 用 demo 模板生成
        run: cp src/chanlun/config.py.demo src/chanlun/config.py
        shell: bash
      - name: Install poetry
        run: pip install poetry
      - name: Install core dependencies
        run: poetry install
      - name: Smoke test fresh core Web import
        env:
          PYTHONPATH: src;web/chanlun_chart
        run: poetry run python -c "from cl_app import create_app; app=create_app({'TESTING': True}); assert not app.extensions['scheduler'].running"
      - name: Install test profile dependencies
        run: poetry install --extras monitor --extras backtest --extras ai
      - name: Install Playwright browser
        run: poetry run playwright install chromium
      - name: Run tests
        env:
          # longbridge SDK 在无凭证时构建 Config 会抛异常，CI 用占位值绕过
          LONGBRIDGE_APP_KEY: dummy_ci
          LONGBRIDGE_APP_SECRET: dummy_ci
          LONGBRIDGE_ACCESS_TOKEN: dummy_ci
        run: poetry run pytest tests/ -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run ruff
        run: |
          pip install ruff
          ruff check --output-format=github src/ web/ tests/

  js-test:
    name: Test (node:test, 前端 charts.js/SSE/macd_stats)
    # 零第三方依赖，只用 Node 内置 node:test/assert/vm，无需 npm install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run node:test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -LiteralPath 'web/chanlun_chart/cl_app/static/js/__tests__' -Filter '*.test.js' | Sort-Object Name
          foreach ($file in $files) {
            $out = & node --test --test-reporter=tap $file.FullName 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $summary = ($out | Select-String -Pattern '^# pass (\d+)$').Matches
            if ($summary.Count -ne 1 -or [int]$summary[0].Groups[1].Value -lt 1) {
              Write-Error "TAP pass summary missing for $($file.Name)"
            }
          }
